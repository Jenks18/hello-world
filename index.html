<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenya Golf Courses</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
          integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
          crossorigin=""/>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="hole-detail-component.css">
</head>
<body>
    <div id="container">
        <div id="sidebar">
            <div id="course-list">
                <h2>Golf Courses</h2>
                <ul id="courses">
                </ul>
            </div>
            <div id="layout-list">
                <h3>Layouts</h3>
                <ul>
                    <li class="active">Short to Short - Official</li>
                    <li>Kinder Krusher (Long to Long)</li>
                    <li>Short to Long</li>
                </ul>
            </div>
        </div>
        <div id="main-panel">
            <div id="map-overview">
                <div id="map"></div>
                <button id="hide-map">Hide Map</button>
            </div>
            <div id="hole-tabs">
            </div>
            <div id="hole-detail">
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"
            integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA=="
            crossorigin=""></script>
    <script src="hole-detail-component.js"></script>
    <script src="script.js"></script>
</body>
</html>
